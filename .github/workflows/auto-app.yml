name: Autonomous App Factory

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: cd ai-store-worker && npm install
        
      - name: Find Gaps and Build Spec
        id: build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          SPEC=$(npx ts-node ai-store-worker/scripts/find-gaps.ts)
          echo "spec=$SPEC" >> $GITHUB_OUTPUT

      - name: AI Codegen and PR
        if: steps.build.outputs.spec != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Use Gemini CLI to generate code and PR based on the spec
          gcli code --prompt "${{ steps.build.outputs.spec }}" --run
