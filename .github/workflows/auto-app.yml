name: Autonomous App Factory (Gemini 3.1 Powered)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Find Gaps and Build Spec
        id: build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          SPEC=$(npx ts-node scripts/find-gaps.ts)
          echo "spec=$SPEC" >> $GITHUB_OUTPUT

      - name: Gemini 3.1 Codegen and PR
        if: steps.build.outputs.spec != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # Gemini 3.1 の超知能を指定してコード生成を実行
          gcli code --prompt "${{ steps.build.outputs.spec }}。Gemini 3.1 の最高品質な TypeScript コードを出力せよ。" --run
