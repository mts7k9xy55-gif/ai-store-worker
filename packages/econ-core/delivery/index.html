<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Econ Delivery Packet</title>
    <meta name="description" content="Econ post-checkout delivery flow">
    <link rel="stylesheet" href="../styles.css">
    <script defer src="/config.js"></script>
    <script defer src="/site.js"></script>
  </head>
  <body>
    <div class="shell app-shell">
      <header class="topbar">
        <a class="brand" href="/">Econ</a>
        <nav class="nav">
          <a href="/">Offer</a>
          <a href="/app/">Intake</a>
          <a href="/privacy/">Privacy</a>
          <a href="/support/">Support</a>
        </nav>
      </header>

      <main class="panel app-card">
        <span class="eyebrow">Manual Fulfillment Flow</span>
        <h1>支払い後の delivery packet</h1>
        <p class="section-copy">
          ここは「払ったあと何が返るか」を固定するページです。支払いメール、事業コア、最初の paid action をまとめると、
          Econ 側が founder memo を返せる状態になります。目標 SLA は 24 時間です。
        </p>

        <label class="field-label" for="payment-email">支払いに使ったメール</label>
        <input id="payment-email" type="email" placeholder="payment email">

        <label class="field-label" for="founder-name">Founder 名</label>
        <input id="founder-name" type="text" placeholder="名前またはチーム名">

        <label class="field-label" for="business-core">誰に何を売るか</label>
        <textarea id="business-core" placeholder="誰に、何を売るか。今の事業コアをそのまま書く"></textarea>

        <label class="field-label" for="company-type">会社形態</label>
        <input id="company-type" type="text" placeholder="株式会社 / 合同会社 / 未定">

        <label class="field-label" for="capital-jpy">資本金</label>
        <input id="capital-jpy" type="text" placeholder="例: 100000">

        <label class="field-label" for="first-revenue-path">最初の paid action</label>
        <textarea id="first-revenue-path" placeholder="受託 / paid pilot / early access / advisory など"></textarea>

        <label class="field-label" for="constraints">制約や今すぐ困っていること</label>
        <textarea id="constraints" placeholder="例: 営業経験が薄い、共同創業者がまだいない、今週中に方向性だけ決めたい"></textarea>

        <div class="cta-row">
          <button class="button button-primary" id="generate-button" type="button">delivery packet を生成</button>
          <a class="button button-secondary" data-checkout-link href="#" target="_blank" rel="noreferrer">まだ支払っていないので checkout</a>
        </div>

        <div class="summary" id="packet-output">フォームを埋めると、support に送る packet と Econ 側の返答骨子が出る。</div>

        <div class="cta-row">
          <button class="button button-secondary" id="copy-button" type="button">packet をコピー</button>
          <a class="button button-secondary" id="mail-button" data-support-mail data-subject="Econ delivery packet" href="#">support にメール下書きを開く</a>
        </div>
      </main>
    </div>

    <script>
      const storageKey = "econIntakeState";
      const fields = {
        paymentEmail: document.getElementById("payment-email"),
        founderName: document.getElementById("founder-name"),
        businessCore: document.getElementById("business-core"),
        companyType: document.getElementById("company-type"),
        capitalJpy: document.getElementById("capital-jpy"),
        firstRevenuePath: document.getElementById("first-revenue-path"),
        constraints: document.getElementById("constraints")
      };

      const output = document.getElementById("packet-output");
      const mailButton = document.getElementById("mail-button");
      const copyButton = document.getElementById("copy-button");

      function loadSavedState() {
        try {
          const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
          if (saved.business_core) fields.businessCore.value = saved.business_core;
          if (saved.company_type) fields.companyType.value = saved.company_type;
          if (saved.capital_jpy) fields.capitalJpy.value = saved.capital_jpy;
          if (saved.first_revenue_path) fields.firstRevenuePath.value = saved.first_revenue_path;
        } catch (error) {
          console.error(error);
        }
      }

      function classifyMotion(firstRevenuePath) {
        const lower = firstRevenuePath.toLowerCase();
        if (lower.includes("受託") || lower.includes("advisory") || lower.includes("consult")) {
          return "最初は受託 or advisory として高単価で切る";
        }
        if (lower.includes("pilot") || lower.includes("early access")) {
          return "paid pilot として人数を絞って売る";
        }
        return "まずは founder network に対して手動販売を行う";
      }

      function buildPacket() {
        const packet = {
          ticket_id: `ECON-${Date.now().toString(36).toUpperCase()}`,
          payment_email: fields.paymentEmail.value.trim(),
          founder_name: fields.founderName.value.trim(),
          business_core: fields.businessCore.value.trim(),
          company_type: fields.companyType.value.trim(),
          capital_jpy: fields.capitalJpy.value.trim(),
          first_revenue_path: fields.firstRevenuePath.value.trim(),
          constraints: fields.constraints.value.trim(),
          recommended_motion: classifyMotion(fields.firstRevenuePath.value.trim()),
          sla: "24h"
        };

        const lines = [
          `ticket_id: ${packet.ticket_id}`,
          `payment_email: ${packet.payment_email || "未入力"}`,
          `founder_name: ${packet.founder_name || "未入力"}`,
          `business_core: ${packet.business_core || "未入力"}`,
          `company_type: ${packet.company_type || "未入力"}`,
          `capital_jpy: ${packet.capital_jpy || "未入力"}`,
          `first_revenue_path: ${packet.first_revenue_path || "未入力"}`,
          `constraints: ${packet.constraints || "未入力"}`,
          "",
          `recommended_motion: ${packet.recommended_motion}`,
          "Econ return package:",
          "- founder memo",
          "- 最初の paid action の優先順位",
          "- 明日やる 3 手",
          "",
          "SLA: 24h"
        ];
        return { packet, text: lines.join("\n") };
      }

      document.getElementById("generate-button").addEventListener("click", () => {
        const result = buildPacket();
        output.textContent = result.text;
        const subject = encodeURIComponent(`Econ delivery packet ${result.packet.ticket_id}`);
        const body = encodeURIComponent(result.text);
        mailButton.href = `mailto:${window.ECON_CONFIG.supportEmail}?subject=${subject}&body=${body}`;
      });

      copyButton.addEventListener("click", async () => {
        const result = buildPacket();
        try {
          await navigator.clipboard.writeText(result.text);
          output.textContent = `${result.text}\n\n[packet copied to clipboard]`;
        } catch (error) {
          output.textContent = `${result.text}\n\n[clipboard copy failed: ${error}]`;
        }
      });

      loadSavedState();
    </script>
  </body>
</html>
