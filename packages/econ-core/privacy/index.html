<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Econ Privacy</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/">Econ</a>
        <nav class="nav">
          <a href="/">Offer</a>
          <a href="/app/">Intake</a>
          <a href="/terms/">Terms</a>
          <a href="/support/">Support</a>
        </nav>
      </header>
      <main class="panel offer-card">
        <h1>Privacy</h1>
        <p class="section-copy">
          Econ は early-access 段階のため、入力された founder intake の内容と checkout に関連する最低限の情報だけを扱います。
          現時点では、大規模な広告トラッキングは接続していません。
        </p>
        <ul class="list">
          <li>入力情報は founder screening と initial support のために使います。</li>
          <li>支払い情報の処理は Stripe が担当します。</li>
          <li>不要になった個人情報は保持しません。</li>
        </ul>
      </main>
    </div>
  </body>
</html>
